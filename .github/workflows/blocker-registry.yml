name: Orbit Blocker list registry

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the registry from uBlock Origin's
        run: |
          curl -fsSL https://raw.githubusercontent.com/gorhill/uBlock/master/assets/assets.json -o /tmp/upstream.json
          python3 tools/orbit_blocker.py --registry /tmp/upstream.json assets/blocker/assets.json
      - name: Commit when it changed
        run: |
          git diff --quiet -- assets/blocker/assets.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/blocker/assets.json
          git commit -m "Update the Orbit Blocker list registry from uBlock Origin."
          git push
